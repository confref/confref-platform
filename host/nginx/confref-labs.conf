# nginx on the host: the only public entry of labs.confref.org and id.confref.org (installed by host/install.sh).
# labs: the static site (Hugo, site/), the map (confref-map), the SPARQL endpoint (Fuseki) and the application
# (apps/graph: search, APIs, reconciliation, calendars, dashboard). id: every path to the application, which
# resolves the IRIs (303 to the documents); the kit (/kit/) from the site, for the pages of both hosts.

limit_req_zone $binary_remote_addr zone=cr_sparql:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=cr_app:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name labs.confref.org id.confref.org;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # id: the IRIs are https, but a client asking with http gets the same answer by a redirect
    location / { return 301 https://$host$request_uri; }
}


server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name labs.confref.org;

    ssl_certificate     /etc/nginx/tls-confref/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls-confref/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/calendar
               text/turtle application/n-triples application/ld+json application/rdf+xml application/sparql-results+json;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;
    absolute_redirect off;

    # the kit: pages contain <!--# include virtual="/kit/1/header.html" -->, which nginx replaces (SSI)
    ssi on;

    root /data/confref/www/site;
    location / { try_files $uri $uri/ =404; }
    location /map/ { alias /data/confref/www/map/; }

    # the SPARQL endpoint, query only (the Fuseki service has no update, upload or admin endpoints)
    location = /sparql {
        limit_req zone=cr_sparql burst=30 nodelay;
        limit_req_status 429;
        limit_except GET POST OPTIONS { deny all; }
        client_max_body_size 1m;
        ssi off;
        proxy_pass http://127.0.0.1:3030/confref/query;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 130s;
    }

    # the application; the paths of the IRIs are answered here as well (the pages name id.confref.org as canonical)
    location ~ ^/(search|api|reconcile|feeds|dashboard|series|event|data|datasets|ontology|dumps)(/|$) {
        limit_req zone=cr_app burst=60 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";    # SSI needs uncompressed HTML
        proxy_read_timeout 60s;
    }
    location = /status.json { proxy_pass http://127.0.0.1:8090; proxy_set_header Host $host; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name id.confref.org;

    ssl_certificate     /etc/nginx/tls-confref/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls-confref/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip on;
    gzip_types text/css application/json image/svg+xml text/turtle application/n-triples application/ld+json
               application/rdf+xml;
    add_header X-Content-Type-Options nosniff always;
    server_tokens off;
    ssi on;

    location /kit/ { root /data/confref/www/site; }
    location / {
        limit_req zone=cr_app burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 60s;
    }
}
