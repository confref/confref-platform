<!doctype html>
<html lang="en" data-area="{{ .Params.area }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <link rel="icon" href="/kit/1/confref-mark.svg" type="image/svg+xml">
  <link rel="preload" href="/kit/1/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/kit/1/confref.css">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ block "head" . }}{{ end }}
</head>
<body class="labs">
  <a class="skip" href="#main">Skip to content</a>
  {{ `<!--# include virtual="/kit/1/header.html" -->` | safeHTML }}
  <main id="main">{{ block "main" . }}{{ end }}</main>
  {{ `<!--# include virtual="/kit/1/footer.html" -->` | safeHTML }}
</body>
</html>
